<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tiger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="tiger-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-tiger)"/>

  <!-- Body / Soft Blue Tee -->
  <path d="M22 128 C22 96 38 88 64 88 C90 88 106 96 106 128 Z" fill="#0284C7"/>
  <circle cx="64" cy="112" r="7" fill="#BAE6FD"/>

  <!-- Ears -->
  <circle cx="36" cy="36" r="13" fill="#EA580C"/>
  <circle cx="36" cy="36" r="8" fill="#FFEDD5"/>
  <circle cx="92" cy="36" r="13" fill="#EA580C"/>
  <circle cx="92" cy="36" r="8" fill="#FFEDD5"/>

  <!-- Tiger Head -->
  <circle cx="64" cy="56" r="34" fill="url(#tiger-fur)"/>

  <!-- Tiger Stripes -->
  <!-- Forehead -->
  <polygon points="64,28 62,38 66,38" fill="#7C2D12"/>
  <polygon points="56,32 58,40 54,40" fill="#7C2D12"/>
  <polygon points="72,32 70,40 74,40" fill="#7C2D12"/>
  <!-- Cheeks -->
  <polygon points="32,54 44,56 44,52" fill="#7C2D12"/>
  <polygon points="96,54 84,56 84,52" fill="#7C2D12"/>
  <polygon points="32,62 42,64 42,60" fill="#7C2D12"/>
  <polygon points="96,62 86,64 86,60" fill="#7C2D12"/>

  <!-- White Muzzle -->
  <ellipse cx="64" cy="67" rx="18" ry="13" fill="#FFFFFF"/>
  <ellipse cx="64" cy="61" rx="6" ry="4.5" fill="#7C2D12"/>
  <path d="M64 65.5 L64 70" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 70 Q64 75 70 70" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="48" cy="49" r="4.5" fill="#1E293B"/>
  <circle cx="49.5" cy="47.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="80" cy="49" r="4.5" fill="#1E293B"/>
  <circle cx="81.5" cy="47.5" r="1.5" fill="#FFFFFF"/>
</svg>

