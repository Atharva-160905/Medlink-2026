<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hippo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="hippo-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-hippo)"/>

  <!-- Body / Soft Shirt -->
  <path d="M22 128 C22 96 38 88 64 88 C90 88 106 96 106 128 Z" fill="#3B82F6"/>
  <circle cx="64" cy="112" r="8" fill="#DBEAFE"/>

  <!-- Hippo Ears -->
  <circle cx="36" cy="36" r="10" fill="#60A5FA"/>
  <circle cx="36" cy="36" r="6" fill="#FBCFE8"/>
  <circle cx="92" cy="36" r="10" fill="#60A5FA"/>
  <circle cx="92" cy="36" r="6" fill="#FBCFE8"/>

  <!-- Hippo Head (Top) -->
  <circle cx="64" cy="50" r="28" fill="url(#hippo-skin)"/>

  <!-- Eyes -->
  <circle cx="50" cy="44" r="4.5" fill="#1E293B"/>
  <circle cx="51.5" cy="42.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="78" cy="44" r="4.5" fill="#1E293B"/>
  <circle cx="79.5" cy="42.5" r="1.5" fill="#FFFFFF"/>

  <!-- Big Friendly Hippo Muzzle/Snout -->
  <ellipse cx="64" cy="72" rx="34" ry="22" fill="#93C5FD"/>
  <ellipse cx="64" cy="74" rx="32" ry="18" fill="#DBEAFE"/>

  <!-- Big Hippo Nostrils -->
  <ellipse cx="52" cy="68" rx="5" ry="6" fill="#1E293B"/>
  <ellipse cx="76" cy="68" rx="5" ry="6" fill="#1E293B"/>

  <!-- Cute Smile -->
  <path d="M54 78 Q64 84 74 78" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Two Tiny Hippo Teeth -->
  <rect x="56" y="78" width="4" height="4" rx="1" fill="#FFFFFF"/>
  <rect x="68" y="78" width="4" height="4" rx="1" fill="#FFFFFF"/>

  <!-- Cheeks Blush -->
  <circle cx="36" cy="70" r="5" fill="#F472B6" opacity="0.4"/>
  <circle cx="92" cy="70" r="5" fill="#F472B6" opacity="0.4"/>
</svg>

