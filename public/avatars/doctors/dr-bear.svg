<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="scrubs-bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-bear)"/>

  <!-- Scrubs Body -->
  <path d="M22 128 C22 96 38 88 64 88 C90 88 106 96 106 128 Z" fill="url(#scrubs-bear)"/>
  <path d="M52 88 L64 104 L76 88 Z" fill="#FFFFFF"/>
  <path d="M57 88 L64 97 L71 88 Z" fill="#CCFBF1"/>

  <!-- Stethoscope -->
  <path d="M40 94 C40 112 50 120 64 120 C78 120 88 112 88 94" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="120" r="4.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
  <circle cx="64" cy="120" r="2" fill="#14B8A6"/>

  <!-- Bear Ears -->
  <circle cx="38" cy="34" r="14" fill="#854D0E"/>
  <circle cx="38" cy="34" r="8" fill="#FDE047"/>
  <circle cx="90" cy="34" r="14" fill="#854D0E"/>
  <circle cx="90" cy="34" r="8" fill="#FDE047"/>

  <!-- Bear Head -->
  <circle cx="64" cy="56" r="34" fill="#A16207"/>

  <!-- Snout -->
  <ellipse cx="64" cy="65" rx="18" ry="14" fill="#FEF08A"/>
  <ellipse cx="64" cy="59" rx="8" ry="5.5" fill="#1E293B"/>
  <!-- Mouth -->
  <path d="M64 64.5 L64 70" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 70 Q64 75 70 70" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="48" cy="49" r="4.5" fill="#1E293B"/>
  <circle cx="50" cy="47.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="80" cy="49" r="4.5" fill="#1E293B"/>
  <circle cx="82" cy="47.5" r="1.5" fill="#FFFFFF"/>

  <!-- Doctor Surgical Cap -->
  <path d="M34 46 C34 26 94 26 94 46 Z" fill="#0D9488"/>
  <rect x="33" y="44" width="62" height="6" rx="3" fill="#14B8A6"/>
  <!-- Cross on Cap -->
  <rect x="62" y="32" width="4" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="59" y="35" width="10" height="4" rx="1" fill="#FFFFFF"/>
</svg>

