<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-penguin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="scrubs-penguin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-penguin)"/>

  <!-- Body / Lab Coat -->
  <path d="M24 128 C24 96 38 86 64 86 C90 86 104 96 104 128 Z" fill="#0F172A"/>
  <path d="M44 86 L64 128 L84 86 Z" fill="#FFFFFF"/>
  <!-- Blue Medical Scrub V-Neck -->
  <path d="M52 86 L64 102 L76 86 Z" fill="url(#scrubs-penguin)"/>

  <!-- Stethoscope -->
  <path d="M40 92 C40 110 50 118 64 118 C78 118 88 110 88 92" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="118" r="4.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>

  <!-- Penguin Head -->
  <ellipse cx="64" cy="54" rx="32" ry="34" fill="#0F172A"/>
  <!-- White Face Mask -->
  <ellipse cx="64" cy="60" rx="24" ry="24" fill="#FFFFFF"/>
  <ellipse cx="50" cy="50" rx="12" ry="14" fill="#FFFFFF"/>
  <ellipse cx="78" cy="50" rx="12" ry="14" fill="#FFFFFF"/>

  <!-- Beak -->
  <polygon points="64,56 55,66 73,66" fill="#F59E0B"/>

  <!-- Cheeks Blush -->
  <circle cx="43" cy="62" r="5" fill="#FECDD3" opacity="0.8"/>
  <circle cx="85" cy="62" r="5" fill="#FECDD3" opacity="0.8"/>

  <!-- Eyes -->
  <circle cx="52" cy="48" r="4" fill="#0F172A"/>
  <circle cx="53.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="76" cy="48" r="4" fill="#0F172A"/>
  <circle cx="77.5" cy="46.5" r="1.5" fill="#FFFFFF"/>

  <!-- Medical Cross Badge on chest -->
  <rect x="80" y="100" width="12" height="15" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="85" y="103" width="2" height="6" fill="#DC2626"/>
  <rect x="83" y="105" width="6" height="2" fill="#DC2626"/>
</svg>

