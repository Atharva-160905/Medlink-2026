  <circle cx="64" cy="118" r="4.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>

  <!-- Fluffy Koala Ears -->
  <circle cx="34" cy="38" r="16" fill="#94A3B8"/>
  <circle cx="34" cy="38" r="10" fill="#F1F5F9"/>
  <circle cx="94" cy="38" r="16" fill="#94A3B8"/>
  <circle cx="94" cy="38" r="10" fill="#F1F5F9"/>

  <!-- Koala Head -->
  <circle cx="64" cy="56" r="32" fill="#64748B"/>
